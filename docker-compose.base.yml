# cf. https://github.com/laravel/sail/tree/1.x/stubs
# cf. https://docs.docker.com/compose/compose-file
services:
  nginx:
    # cf. https://hub.docker.com/_/nginx
    image: nginx:1.25
    # cf. https://docs.docker.com/compose/environment-variables/env-file
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - ${FORWARD_APP_PORT:-80}:80
  php-fpm:
    # cf. https://docs.docker.com/compose/compose-file/build
    build:
      context: ./backend
      dockerfile: ./docker/app/Dockerfile
      target: ${ENV}
      args:
        CONFIG_DIR: ./docker/app
        PHP_VERSION: ${PHP_VERSION}
        WORKDIR: ${CONTAINER_PROJECT_DIR}/backend
        WEB_USER: ${WEB_USER}
    image: ${USER}/${COMPOSE_PROJECT_NAME}-php
    profiles: ['backend']
    environment:
      SHELL: /usr/bin/bash
    volumes:
      - type: volume
        source: vendor
        target: ${CONTAINER_PROJECT_DIR}/backend/vendor/
      - type: volume
        source: node_modules-backend
        target: ${CONTAINER_PROJECT_DIR}/backend/node_modules/
      # cf. https://docs.docker.com/desktop/previous-versions/edge-releases-mac/#docker-desktop-community-2330
      - type: bind
        source: ./backend
        target: ${CONTAINER_PROJECT_DIR}/backend
        consistency: delegated
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
  mysql:
    # cf. https://hub.docker.com/_/mariadb
    image: mariadb:10
    profiles: ['backend']
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${FORWARD_DB_PORT:-3307}:3306
    volumes:
      - type: volume
        source: mysql
        target: /var/lib/mysql/
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
      retries: 3
      timeout: 5s
volumes:
  vendor:
    driver: local
  node_modules-backend:
    driver: local
  mysql:
    driver: local
