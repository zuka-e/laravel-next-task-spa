services:
  nginx:
    profiles: ["backend"]
    environment:
      ROOT_DIR: ${CONTAINER_PROJECT_DIR}/backend/public
    volumes:
      # cf. https://docs.docker.com/compose/compose-file/05-services/#long-syntax-5
      # cf. https://hub.docker.com/_/nginx - Using environment variables
      - type: bind
        source: ./backend/docker/nginx/default.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ./backend/docker/nginx/${ENV}.conf
        target: /etc/nginx/templates/${ENV}.conf.template
        read_only: true
      - type: bind
        source: ./backend/public
        target: ${CONTAINER_PROJECT_DIR}/backend/public
        read_only: true
    depends_on:
      php-fpm:
        condition: service_started
  php-fpm:
    profiles: ["backend"]
    # cf. https://docs.docker.com/compose/compose-file/build
    build:
      context: ./backend
      dockerfile: ./docker/app/Dockerfile
      target: ${ENV}
      args:
        CONFIG_DIR: ./docker/app
        PHP_VERSION: ${PHP_VERSION}
        WORKDIR: ${CONTAINER_PROJECT_DIR}/backend
        WEB_USER: ${WEB_USER}
    image: ${USER}/${COMPOSE_PROJECT_NAME}-php
    environment:
      SHELL: /usr/bin/bash
    volumes:
      - type: volume
        source: vendor
        target: ${CONTAINER_PROJECT_DIR}/backend/vendor/
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
  mysql:
    # cf. https://hub.docker.com/_/mariadb
    image: mariadb:11
    profiles: ["backend"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${FORWARD_DB_PORT:-3307}:3306
    volumes:
      - type: volume
        source: mysql
        target: /var/lib/mysql/
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  vendor:
    driver: local
  mysql:
    driver: local
